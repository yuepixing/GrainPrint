name: Build GrainPrint

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: false
        default: "v0.3.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macOS
            script: ./scripts/build_macos.sh
          - os: windows-latest
            os_name: Windows
            script: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Build application
        run: ${{ matrix.script }}

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: GrainPrint-macOS
          path: dist/GrainPrint.app

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: GrainPrint-Windows
          path: dist/**

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: GrainPrint-macOS
          path: release/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: GrainPrint-Windows
          path: release/windows

      - name: Create release archives
        shell: bash
        run: |
          cd release
          find macos -maxdepth 6 \( -name '*.app' -o -name Info.plist \) | head -50
          find windows -maxdepth 3 -type f | head -20
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          mac_app = None
          mac_apps = list(Path('macos').rglob('*.app'))
          if mac_apps:
              mac_app = mac_apps[0]
          else:
              plists = list(Path('macos').rglob('Info.plist'))
              if plists:
                  parent = plists[0].parent
                  mac_app = parent.parent
          if not mac_app or not mac_app.is_dir():
              raise SystemExit('macOS application bundle not found')

          windows_exes = list(Path('windows').rglob('GrainPrint.exe'))
          if not windows_exes:
              raise SystemExit('GrainPrint.exe not found')

          def add_dir(z, path, arc_prefix):
              for p in sorted(path.rglob('*')):
                  if p.is_file():
                      z.write(p, str(Path(arc_prefix) / p.relative_to(path)))

          with zipfile.ZipFile('GrainPrint-macOS.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              add_dir(z, mac_app, 'GrainPrint.app')

          with zipfile.ZipFile('GrainPrint-Windows.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(windows_exes[0].resolve(), 'GrainPrint.exe')
          PY
          ls -lh GrainPrint-macOS.zip GrainPrint-Windows.zip
          sha256sum GrainPrint-macOS.zip GrainPrint-Windows.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: GrainPrint ${{ inputs.tag || github.ref_name }}
          files: |
            release/GrainPrint-macOS.zip
            release/GrainPrint-Windows.zip
            templates/grainprint_import_template_v0.7.xlsx

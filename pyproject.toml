[project]
name = "GrainPrint"
version = "0.2.0"
description = "粮食品质劣变标志物数据库，基于 Flet 1.0 的跨平台谷物管理系统"
authors = [
    {name = "zihanjia", email = "zihan.jia@digitalsalt.cn"},
]
dependencies = ["SQLAlchemy>=2.0.41", "pandas>=2.3.1", "openpyxl>=3.1.5", "pydantic>=2.11.7", "duckdb>=1.3.2", "duckdb-engine>=0.17.0", "nuitka>=2.7.12", "ordered-set>=4.1.0", "pip>=25.3", "flet>=1.0.4,<1.1", "fastapi>=0.115.12,<0.116", "certifi>=2026.10.19"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["flet[all]>=1.0.4,<1.1", "pytest>=9.0.0", "pyinstaller>=6.22.3"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.flet.app]
path = "src"